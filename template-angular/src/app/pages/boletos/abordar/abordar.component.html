<!-- Paradero de abordaje -->
<div class="col-lg-6">
  <div class="form-group">
    <label class="form-control-label">
      Paradero de abordaje <span class="text-danger">*</span>
    </label>
    <select formControlName="paraderoAbordajeId" class="form-control"
            [class.is-invalid]="form.get('paraderoAbordajeId')!.touched && form.get('paraderoAbordajeId')!.invalid">
      <option [ngValue]="null" disabled>
        {{ !programacionSeleccionada ? 'Seleccione primero una programación...' : 'Seleccione el paradero donde aborda...' }}
      </option>
      <option *ngFor="let p of paraderos" [ngValue]="p.id">{{ p.nombre }}</option>
    </select>
    <div class="invalid-feedback">Selecciona el paradero de abordaje.</div>
    <small *ngIf="paraderosCargando" class="text-muted">
      <i class="fas fa-spinner fa-spin mr-1"></i>Cargando paraderos...
    </small>
    <small *ngIf="!paraderosCargando && programacionSeleccionada && paraderos.length === 0" class="text-warning">
      Esta ruta no tiene paraderos configurados.
    </small>
  </div>
</div>
