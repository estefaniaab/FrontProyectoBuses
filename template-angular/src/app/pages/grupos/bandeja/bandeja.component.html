<div class="header bg-gradient-info pb-8 pt-5 pt-md-8"></div>

<div class="container-fluid mt--7">
  <div class="row">
    <div class="col">
      <div class="card shadow">

        <div class="card-header bg-transparent">
          <div class="row align-items-center">
            <div class="col">
              <h3 class="mb-0">
                <i class="material-icons mr-2" style="vertical-align:middle">inbox</i>
                Bandeja de mensajes
                <span *ngIf="noLeidas > 0" class="badge badge-danger ml-2">{{ noLeidas }}</span>
              </h3>
            </div>
            <div class="col text-right">
              <button *ngIf="noLeidas > 0" class="btn btn-sm btn-outline-primary" (click)="marcarTodasLeidas()">
                Marcar todas como leídas
              </button>
            </div>
          </div>
        </div>

        <div class="card-body">

          <!-- Filtros -->
          <div class="row mb-3">
            <div class="col-md-8">
              <div class="btn-group" role="group">
                <button class="btn btn-sm" [ngClass]="filtro === 'todos' ? 'btn-primary' : 'btn-outline-primary'"
                        (click)="cambiarFiltro('todos')">Todos</button>
                <button class="btn btn-sm" [ngClass]="filtro === 'no_leidos' ? 'btn-primary' : 'btn-outline-primary'"
                        (click)="cambiarFiltro('no_leidos')">No leídos</button>
                <button class="btn btn-sm" [ngClass]="filtro === 'grupo' ? 'btn-primary' : 'btn-outline-primary'"
                        (click)="cambiarFiltro('grupo')">Grupales</button>
                <button class="btn btn-sm" [ngClass]="filtro === 'alerta' ? 'btn-primary' : 'btn-outline-primary'"
                        (click)="cambiarFiltro('alerta')">Alertas</button>
              </div>
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control form-control-sm"
                     placeholder="Buscar..."
                     [(ngModel)]="busqueda"
                     (input)="aplicarFiltro()">
            </div>
          </div>

          <!-- Spinner -->
          <div *ngIf="cargando" class="text-center py-4">
            <div class="spinner-border text-info"></div>
          </div>

          <!-- Lista -->
          <div *ngIf="!cargando">
            <div *ngFor="let n of notificacionesFiltradas"
                 class="d-flex align-items-start p-3 border-bottom"
                 [ngStyle]="{ 'background-color': n.leido ? '#fff' : '#f0f7ff', 'cursor': 'pointer' }"
                 (click)="abrir(n)">

              <!-- Icono -->
              <div class="mr-3 mt-1">
                <span class="rounded-circle d-flex align-items-center justify-content-center"
                      [ngStyle]="{ 'background-color': colorTipo(n.tipo) + '20',
                                   'width': '44px', 'height': '44px', 'flex-shrink': '0' }">
                  <i class="material-icons" [ngStyle]="{ 'color': colorTipo(n.tipo), 'font-size': '22px' }">
                    {{ iconoTipo(n.tipo) }}
                  </i>
                </span>
              </div>

              <!-- Contenido -->
              <div class="flex-grow-1">
                <div class="d-flex justify-content-between">
                  <span [ngStyle]="{ 'font-weight': n.leido ? '400' : '700', 'font-size': '14px', 'color': '#333' }">
                    {{ n.titulo }}
                  </span>
                  <small class="text-muted">{{ n.fechaCreacion | date:'dd/MM HH:mm' }}</small>
                </div>
                <div class="text-muted" style="font-size:13px; margin-top:2px">{{ n.mensaje }}</div>
                <div class="mt-1">
                  <span class="badge badge-pill"
                        [ngStyle]="{ 'background-color': colorTipo(n.tipo) + '20',
                                     'color': colorTipo(n.tipo), 'font-size': '10px' }">
                    {{ n.tipo.replace('_', ' ') }}
                  </span>
                </div>
              </div>

              <!-- Indicador no leído -->
              <div *ngIf="!n.leido" class="ml-2 mt-2"
                   style="width:10px;height:10px;background:#5e72e4;border-radius:50%;flex-shrink:0">
              </div>
            </div>

            <!-- Vacío -->
            <div *ngIf="notificacionesFiltradas.length === 0" class="text-center text-muted py-5">
              <i class="material-icons d-block mb-2" style="font-size:48px">inbox</i>
              No hay mensajes en esta bandeja.
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
