<div class="header bg-gradient-danger pb-8 pt-5 pt-md-8">
</div>

<div class="container-fluid mt--7">
  <div class="row">
    <div class="col">
      <div class="card shadow">

        <div class="card-header bg-transparent">
          <h3 class="mb-0">Paraderos</h3>
          <button class="btn btn-success btn-sm" (click)="create()" title="Agregar">
            <i class="material-icons">add</i>
          </button>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table">
              <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Clasificación</th>
                <th>Latitud</th>
                <th>Longitud</th>
                <th>Acciones</th>
              </tr>
              <tr *ngFor="let p of paraderos">
                <td>{{ p.id }}</td>
                <td>{{ p.nombre }}</td>
                <td>{{ getClasificacionLabel(p.clasificacion) }}</td>
                <td>{{ p.latitud | number:'1.5-5' }}</td>
                <td>{{ p.longitud | number:'1.5-5' }}</td>
                <td>
                  <button class="btn btn-info btn-sm" (click)="view(p.id)" title="Ver">
                    <i class="material-icons">visibility</i>
                  </button>
                  <button class="btn btn-warning btn-sm" (click)="edit(p.id)" title="Editar">
                    <i class="material-icons">edit</i>
                  </button>
                  <button class="btn btn-danger btn-sm" (click)="delete(p.id)" title="Eliminar">
                    <i class="material-icons">delete</i>
                  </button>
                </td>
              </tr>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
