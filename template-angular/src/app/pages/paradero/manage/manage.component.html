<div class="header bg-gradient-danger pb-8 pt-5 pt-md-8">
</div>

<div class="container-fluid mt--7">
  <div class="row">
    <div class="col">
      <div class="card shadow">

        <div class="card-header bg-transparent">
          <h3 class="mb-0" *ngIf="mode==1">Detalle del Paradero</h3>
          <h3 class="mb-0" *ngIf="mode==2">Crear Paradero</h3>
          <h3 class="mb-0" *ngIf="mode==3">Actualizar Paradero</h3>
        </div>

        <div class="card-body">
          <form class="form" [formGroup]="theFormGroup">
            <div class="card-body container">

              <!-- ID (solo visible en view/update) -->
              <div class="row" *ngIf="mode !== 2">
                <div class="col-3">ID</div>
                <div class="col-9">
                  <input type="text" class="form-control" formControlName="id" disabled>
                </div>
              </div>
              <br *ngIf="mode !== 2">

              <!-- Nombre -->
              <div class="row">
                <div class="col-3">Nombre</div>
                <div class="col-9">
                  <input type="text" class="form-control" formControlName="nombre"
                         placeholder="Ej: Paradero El Centro">
                  <div *ngIf="getTheFormGroup['nombre'].errors &&
                              (getTheFormGroup['nombre'].dirty || getTheFormGroup['nombre'].touched || trySend)">
                    <strong *ngIf="getTheFormGroup['nombre'].errors?.['required']" class="msnError">Requerido</strong>
                    <strong *ngIf="getTheFormGroup['nombre'].errors?.['minlength']" class="msnError">
                      Mínimo 3 caracteres
                    </strong>
                  </div>
                </div>
              </div>
              <br>

              <!-- Clasificación -->
              <div class="row">
                <div class="col-3">Clasificación</div>
                <div class="col-9">
                  <select class="form-control" formControlName="clasificacion">
                    <option value="" disabled>Selecciona una clasificación</option>
                    <option *ngFor="let c of CLASIFICACIONES" [value]="c">
                      {{ c | titlecase }}
                    </option>
                  </select>
                  <div *ngIf="getTheFormGroup['clasificacion'].errors &&
                              (getTheFormGroup['clasificacion'].dirty || getTheFormGroup['clasificacion'].touched || trySend)">
                    <strong *ngIf="getTheFormGroup['clasificacion'].errors?.['required']" class="msnError">Requerido</strong>
                  </div>
                </div>
              </div>
              <br>

              <!-- Latitud -->
              <div class="row">
                <div class="col-3">Latitud</div>
                <div class="col-9">
                  <input type="number" class="form-control" formControlName="latitud"
                         placeholder="6.24220" step="0.00001">
                  <div *ngIf="getTheFormGroup['latitud'].errors &&
                              (getTheFormGroup['latitud'].dirty || getTheFormGroup['latitud'].touched || trySend)">
                    <strong *ngIf="getTheFormGroup['latitud'].errors?.['required']" class="msnError">Requerido</strong>
                  </div>
                </div>
              </div>
              <br>

              <!-- Longitud -->
              <div class="row">
                <div class="col-3">Longitud</div>
                <div class="col-9">
                  <input type="number" class="form-control" formControlName="longitud"
                         placeholder="-75.58120" step="0.00001">
                  <div *ngIf="getTheFormGroup['longitud'].errors &&
                              (getTheFormGroup['longitud'].dirty || getTheFormGroup['longitud'].touched || trySend)">
                    <strong *ngIf="getTheFormGroup['longitud'].errors?.['required']" class="msnError">Requerido</strong>
                  </div>
                </div>
              </div>
              <br>

              <!-- MAPA -->
              <div class="row">
                <div class="col-3">
                  Ubicación en mapa
                  <br>
                  <small class="text-muted" *ngIf="mode !== 1">
                    Haz clic en el mapa o arrastra el marcador para ubicar el paradero
                  </small>
                </div>
                <div class="col-9">
                  <div id="mapa-manage" class="mapa-manage"></div>
                </div>
              </div>
              <br>

              <!-- Botones -->
              <div class="row">
                <div class="col-3"></div>
                <div class="col-9">
                  <button type="button" class="btn btn-primary btn-block" (click)="back()">
                    Regresar
                  </button>
                  <button type="button" class="btn btn-success btn-block" (click)="create()" *ngIf="mode==2">
                    Crear
                  </button>
                  <button type="button" class="btn btn-warning btn-block" (click)="update()" *ngIf="mode==3">
                    Actualizar
                  </button>
                </div>
              </div>

            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
