<div class="header bg-gradient-danger pb-8 pt-5 pt-md-8"></div>

<div class="container-fluid mt--7">
  <div class="row">
    <div class="col">
      <div class="card shadow">

        <div class="card-header bg-transparent">
          <div class="row align-items-center">
            <div class="col-md-8 col-sm-6">
              <h3 class="mb-0">Historial de PQRS - {{ nombreUsuario }}</h3>
            </div>

            <div class="col-md-4 col-sm-6 text-right">
              <button class="btn btn-primary btn-sm mr-2" (click)="crearNuevoPQRS()">
                <i class="fa fa-plus"></i> Crear PQRS
              </button>
              <button class="btn btn-secondary btn-sm" (click)="back()">
                <i class="fa fa-arrow-left"></i> Regresar
              </button>
            </div>
          </div>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-items-center table-flush">
              <thead class="thead-light">
              <tr>
                <th>Id</th>
                <th>Radicado</th>
                <th>Tipo</th>
                <th>Categoría</th>
                <th>Estado</th>
                <th>Fecha Creación</th>
                <th>Acciones</th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let pqrs of pqrsList">
                <td>{{ pqrs.id }}</td>
                <td><strong>{{ pqrs.radicado || 'N/A' }}</strong></td>
                <td>{{ pqrs.tipo }}</td>
                <td>{{ pqrs.categoria }}</td>
                <td>
                    <span class="badge" [ngClass]="{
                      'badge-warning': pqrs.estado?.toUpperCase() === 'ENVIADO',
                      'badge-info': pqrs.estado?.toUpperCase() === 'EN_REVISION' || pqrs.estado?.toUpperCase() === 'EN REVISION',
                      'badge-success': pqrs.estado?.toUpperCase() === 'RESUELTO',
                      'badge-danger': pqrs.estado?.toUpperCase() === 'RECHAZADO' || pqrs.estado?.toUpperCase() === 'CANCELADO'
                    }">
                      {{ pqrs.estado }}
                    </span>
                </td>
                <td>{{ pqrs.createdAt | date:'short' }}</td>
                <td>
                  <button class="btn btn-info btn-sm mr-1" (click)="view(pqrs.radicado)" title="Ver Detalle">
                    <i class="material-icons" style="font-size: 16px; vertical-align: middle;">visibility</i>
                  </button>
                  <button class="btn btn-warning btn-sm mr-1" (click)="edit(pqrs.radicado)" title="Editar / Responder">
                    <i class="material-icons" style="font-size: 16px; vertical-align: middle;">edit</i>
                  </button>
                  <button class="btn btn-danger btn-sm" (click)="delete(pqrs.id)" title="Eliminar">
                    <i class="material-icons" style="font-size: 16px; vertical-align: middle;">delete</i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="pqrsList.length === 0">
                <td colspan="7" class="text-center text-muted py-4">
                  No hay solicitudes PQRS registradas para este usuario.
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
