<div class="header bg-gradient-danger pb-8 pt-5 pt-md-8"></div>

<div class="container mt--7">
  <div class="row justify-content-center">
    <div class="col-xl-6 col-lg-8 col-md-10">
      <div class="card shadow border-0">
        <div class="card-body p-5 text-center">

          <div class="icon icon-shape bg-soft-danger text-danger rounded-circle mb-4" style="width: 60px; height: 60px; font-size: 24px; background-color: #fee2e2;">
            <i class="ni ni-zoom-split-in"></i>
          </div>

          <h2 class="mb-2 font-weight-bold text-dark">Consultar Estado de tu PQRS</h2>
          <p class="text-muted small mb-4">
            Ingresa el código de radicado que te fue asignado al momento de crear la solicitud.
          </p>

          <div class="form-group mb-4">
            <div class="input-group input-group-alternative mb-4 shadow-sm">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="ni ni-key-25 text-muted"></i></span>
              </div>
              <input type="text"
                     class="form-control text-center font-weight-bold text-uppercase"
                     placeholder="Ej: PQRS-2026-000023"
                     [(ngModel)]="radicadoInput"
                     (keyup.enter)="buscar()">
            </div>
          </div>

          <button class="btn btn-danger btn-block shadow-md btn-lg" (click)="buscar()">
            <i class="fa fa-search"></i> Buscar Solicitud
          </button>

        </div>
      </div>
    </div>
  </div>
</div>
