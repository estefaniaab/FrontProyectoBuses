<div class="header bg-gradient-danger pb-8 pt-5 pt-md-8">
</div>

<div class="container-fluid mt--7">
  <div class="row">
    <div class="col">
      <div class="card shadow">

        <div class="card-header bg-transparent">
          <div class="row align-items-center">
            <div class="col-md-4">
              <h3 class="mb-0">Buses</h3>
              <button class="btn btn-success btn-sm mt-2" (click)="create()" title="Agregar">
                <i class="material-icons">add</i>
              </button>
            </div>
          </div>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table">
              <tr>
                <td>Id</td>
                <td>Placa</td>
                <td>Modelo</td>
                <td>Año</td>
                <td>Capacidad máxima</td>
                <td>Sentados</td>
                <td>Parados</td>
                <td>Estado</td>
                <td>Foto</td>
                <td>Código QR</td>
                <td>Acciones</td>
              </tr>

              <tr *ngFor="let bus of buses">
                <td>{{ bus.id }}</td>
                <td>{{ bus.placa }}</td>
                <td>{{ bus.modelo }}</td>
                <td>{{ bus.anio }}</td>
                <td>{{ bus.capacidadMaximaPasajeros }}</td>
                <td>{{ bus.capacidadSentados }}</td>
                <td>{{ bus.capacidadParados }}</td>
                <td>{{ bus.estado }}</td>
                <td>
                  <img *ngIf="bus.fotoUrl" [src]="bus.fotoUrl" alt="Foto bus"
                    width="40" height="40" class="rounded-circle">
                  <span *ngIf="!bus.fotoUrl" class="text-muted">Sin foto</span>
                </td>
                <td>
                  <qrcode *ngIf="bus.codigoQr" [qrdata]="bus.codigoQr" [width]="40"
                    [errorCorrectionLevel]="'M'">
                  </qrcode>

                  <span *ngIf="!bus.codigoQr" class="text-muted">Sin QR</span>
                </td>
                <td>
                  <button class="btn btn-info btn-sm" (click)="view(bus.id)" title="Ver">
                    <i class="material-icons">visibility</i>
                  </button>

                  <button class="btn btn-warning btn-sm" (click)="edit(bus.id)" title="Editar">
                    <i class="material-icons">edit</i>
                  </button>

                  <button class="btn btn-danger btn-sm" (click)="delete(bus.id)" title="Eliminar">
                    <i class="material-icons">delete</i>
                  </button>
                </td>
              </tr>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
